name: Deploy to GitHub Pages

on:
  # Publish whenever you push to main.
  push:
    branches: [main]
  # Or trigger a rebuild by hand from the Actions tab.
  workflow_dispatch:

# Permissions the deploy needs. Nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the first deploy finish rather than
# cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          # npm ci enforces the lockfile's integrity hashes. Those were computed
          # from tarballs served by a corporate mirror, so if the mirror repacked
          # anything they will not match npmjs.org and ci aborts. Fall back to a
          # fresh resolve, and surface the reason as an annotation.
          if npm ci 2>&1 | tee /tmp/npm.log; then
            echo "npm ci ok"
          else
            echo "::warning::npm ci failed, fell back to npm install. Tail: $(tail -c 900 /tmp/npm.log | tr '\n' ' ' | sed 's/::/../g')"
            rm -f package-lock.json
            npm install --no-audit --no-fund 2>&1 | tee -a /tmp/npm.log
          fi
          echo "::notice::install tail: $(tail -c 700 /tmp/npm.log | tr '\n' ' ' | sed 's/::/../g')"
          echo "::notice::node_modules: $(test -d node_modules && echo present || echo MISSING), entries $(ls node_modules 2>/dev/null | wc -l), astro $(test -e node_modules/.bin/astro && echo yes || echo no)"

      - name: Build site
        run: |
          echo "::notice::node $(node -v), npm $(npm -v)"
          echo "::notice::bin: $(ls node_modules/.bin 2>/dev/null | tr '\n' ' ' | head -c 400)"
          if npm run build 2>&1 | tee /tmp/build.log; then
            echo "build ok"
            echo "::notice::dist: $(ls dist 2>&1 | tr '\n' ' ' | head -c 300)"
            echo "::notice::dist files: $(find dist -type f 2>/dev/null | wc -l), pwd $(pwd)"
          else
            echo "::error::build failed: $(tail -c 900 /tmp/build.log | tr '\n' ' ' | sed 's/::/../g')"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
