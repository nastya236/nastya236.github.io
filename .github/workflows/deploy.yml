name: Deploy to GitHub Pages

on:
  # Publish whenever you push to main.
  push:
    branches: [main]
  # Or trigger a rebuild by hand from the Actions tab.
  workflow_dispatch:

# Permissions the deploy needs. Nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the first deploy finish rather than
# cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `npm install`, not `npm ci`: the committed lockfile is generated on
      # macOS and is missing sharp's platform-gated @emnapi/* entries that
      # Linux resolution needs, which makes `npm ci` refuse to run.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
