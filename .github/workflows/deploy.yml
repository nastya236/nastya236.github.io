name: Deploy to GitHub Pages

on:
  # Publish whenever you push to main.
  push:
    branches: [main]
  # Or trigger a rebuild by hand from the Actions tab.
  workflow_dispatch:

# Permissions the deploy needs. Nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the first deploy finish rather than
# cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          # redirect rather than pipe: a pipe would hand back tee's exit status,
          # not npm's, and silently swallow the failure.
          if npm ci > /tmp/npm.log 2>&1; then
            echo "npm ci ok"
          else
            echo "::warning::npm ci failed: $(grep -m8 'npm error' /tmp/npm.log | tr '\n' ' ' | sed 's/::/../g' | head -c 900)"
            rm -f package-lock.json
            npm install --no-audit --no-fund
          fi
          echo "::notice::node_modules $(test -d node_modules && echo present || echo MISSING), astro $(test -e node_modules/.bin/astro && echo yes || echo no)"

      - name: Build site
        run: |
          if npm run build > /tmp/build.log 2>&1; then
            echo "::notice::dist files: $(find dist -type f | wc -l)"
          else
            echo "::error::build failed: $(tail -c 900 /tmp/build.log | tr '\n' ' ' | sed 's/::/../g')"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
